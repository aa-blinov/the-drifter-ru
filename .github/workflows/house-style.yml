name: house style

# Внутренний стандарт, который проверяется автоматически.
#
# Проверяющий скрипт не хранится в этом репозитории. Он подтягивается из
# aa-blinov/golden-repo на зафиксированной версии, поэтому улучшение
# стандарта доходит до каждого репозитория, который его принял, без pull
# request здесь.
#
# Dependabot читает эту ссылку как зависимость и открывает pull request, который
# поднимает зафиксированную версию. Это весь механизм обновления: стандарт
# меняется, не делая CI каждого зависимого репозитория красным, и каждый
# репозиторий показывает, какой версии следует, потому что версия указана в
# этом файле.

on:
  # Каждая ветка, потому что ветка по умолчанию у репозитория из этой коллекции
  # не всегда main: большинство на master, а один на prod. Фильтр по main
  # означал бы, что проверка не запускается никогда.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  housecheck:
    name: House style
    runs-on: ubuntu-latest
    steps:
      # Зафиксировано по коммиту, а не по тегу: тег это движущаяся цель, которую
      # может перенаправить любой, у кого есть права на запись в action.
      # Dependabot обновляет хеш, а комментарий нужен читателю, чтобы знать
      # версию.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Учётные данные checkout не нужны после клонирования, и именно
          # остаточные данные в git config попадают внутрь выгруженного артефакта.
          persist-credentials: false

      - uses: aa-blinov/golden-repo/.github/actions/house-style@v1.0.13
        with:
          report: house-style.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: house-style-report
          path: house-style.json
