name: release

# Релиз по тегу. Тег v* создаёт релиз с пакетом установки; заметки берутся из
# docs/releases/vX.Y.Z.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Извлечь версию
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Сборка $VERSION"

      - name: Тесты
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v

      - name: Собрать пакет
        run: |
          test -f "docs/releases/v${{ steps.version.outputs.version }}.md"
          python3 scripts/build_release.py "${{ steps.version.outputs.version }}"

      - name: Опубликовать
        uses: softprops/action-gh-release@v2
        with:
          name: The Drifter RU v${{ steps.version.outputs.version }}
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: dist/the-drifter-ru-v${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
