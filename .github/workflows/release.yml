name: release

# Релиз по тегу. Тег v* создаёт релиз с файлом, который читает игра, и со
# скриптами его установки.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Извлечь версию
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Сборка $VERSION"

      - name: Тесты
        run: python3 -m unittest discover -s tests -v

      - name: Собрать пакет
        run: |
          mkdir -p dist
          cp translation/Russian/translation.csv dist/
          cp scripts/install.py scripts/fetch_fonts.py dist/
          cp LICENSE docs/style-guide.md docs/glossary.md dist/
          cp docs/proofreading.md docs/lore.md docs/layout.md dist/
          cd dist && zip -r "../the-drifter-ru-v${VERSION}.zip" .

      - name: Опубликовать
        uses: softprops/action-gh-release@v2
        with:
          files: the-drifter-ru-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          body_path: CHANGELOG.md
