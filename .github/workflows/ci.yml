name: ci

# Перевод это пакет данных, поэтому сборка и есть проверка: поставляемый CSV
# читается так же, как его читает игра, и сверяется с английским корпусом, из
# которого он собран. Проверка внутреннего стандарта вынесена в отдельный
# workflow, поэтому сбой стандарта видно иначе, чем сбой данных.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Тесты
        run: python3 -m unittest discover -s tests -v

      - name: Проверки
        run: python3 src/drru/qa.py

      - name: Файл, который читает игра
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, os
          path = "translation/Russian/translation.csv"
          with open(path, "rb") as fh:
              raw = fh.read()
          print("bytes  %d" % len(raw))
          print("sha256 %s" % hashlib.sha256(raw).hexdigest())
          print("bom    %s" % (raw[:3] == b"\xef\xbb\xbf"))
          rows = list(csv.reader(io.StringIO(raw.decode("utf-8-sig"), newline="")))
          print("header %s" % rows[0])
          print("rows   %d" % (len(rows) - 1))
          PY
